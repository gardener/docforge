name: Release
on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        options:
          - bump-minor
          - bump-patch

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      mode: release
      publish: true

  release-to-github-and-bump:
    if: github.ref == 'refs/heads/master'
    uses: gardener/cc-utils/.github/workflows/release.yaml@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0
    needs:
      - build
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      github-environment: release
      release-commit-target: branch
      next-version: ${{ inputs.next-version }}
      slack-channel-id: G01MH3C9UCS # #gardener-documentation
      assets: |
        - name: docforge-darwin-amd64
          type: ocm-resource
          id:
            name: docforge
            os: darwin
            architecture: amd64
        - name: docforge-darwin-arm64
          type: ocm-resource
          id:
            name: docforge
            os: darwin
            architecture: arm64
        - name: docforge-linux-amd64
          type: ocm-resource
          id:
            name: docforge
            os: linux
            architecture: amd64
        - name: docforge-linux-arm64
          type: ocm-resource
          id:
            name: docforge
            os: linux
            architecture: arm64
        - name: docforge-windows-386
          type: ocm-resource
          id:
            name: docforge
            os: windows
            architecture: '386'
